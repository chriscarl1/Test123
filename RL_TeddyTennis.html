<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Teddy Tennis — Ralph Lauren US Open</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A2342;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="640"></canvas>
<script>
// ===== CONSTANTS =====
const W = 480, H = 640;
const COLORS = {
  navy: '#0A2342', red: '#C8102E', cream: '#F5F0E8',
  grass: '#4A7C59', courtBlue: '#3A6EA5', courtGreen: '#2E5B3A',
  gold: '#C9A84C', offWhite: '#EDE8DC', white: '#FFFFFF',
  yellow: '#CCEE44', shadow: 'rgba(0,0,0,0.3)'
};

// Perspective court geometry
const NEAR_SY = 580; // player baseline screen Y
const FAR_SY  = 242; // CPU baseline screen Y
const NEAR_LX = 30;  // court left at near
const NEAR_RX = 450; // court right at near
const FAR_LX  = 152; // court left at far
const FAR_RX  = 328; // court right at far
const PLAYER_CY = 0.04; // player position in court Y [0=near,1=far]
const CPU_CY    = 0.96; // CPU position in court Y
const NET_CY    = 0.5;  // net midpoint
const NET_HEIGHT_Z = 15; // net height (z-units)
const GRAVITY   = 0.45;
const Z_VIS     = 2.2;  // screen pixels per z-unit (visual scale)
// Legacy aliases for splash/HUD
const COURT_TOP = FAR_SY - 30, COURT_BOTTOM = NEAR_SY + 20;
const COURT_LEFT = NEAR_LX, COURT_RIGHT = NEAR_RX;
const PLAYER_Y = NEAR_SY, CPU_Y = FAR_SY;
const NET_Y = Math.round(NEAR_SY + (FAR_SY - NEAR_SY) * NET_CY);

function courtToScreen(cx, cy, z) {
  z = z || 0;
  const sy = NEAR_SY + (FAR_SY - NEAR_SY) * cy;
  const lx = NEAR_LX + (FAR_LX - NEAR_LX) * cy;
  const rx = NEAR_RX + (FAR_RX - NEAR_RX) * cy;
  const sx = lx + cx * (rx - lx);
  const perspScale = 1 - cy * 0.45;
  const zOffset = -z * perspScale * Z_VIS;
  return { x: sx, y: sy + zOffset, scale: perspScale };
}

// ===== AUDIO =====
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playThwack() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}
function playPoint() {
  try {
    const ctx = getAudio();
    [440, 660].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);
    });
  } catch(e) {}
}
function playFanfare() {
  try {
    const ctx = getAudio();
    [523, 659, 784].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle'; osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.22;
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e) {}
}

// ===== CONFETTI =====
let confetti = [];
function spawnConfetti(x, y) {
  for (let i = 0; i < 60; i++) {
    confetti.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.8) * 9,
      color: [COLORS.navy, COLORS.red, COLORS.gold, COLORS.cream, COLORS.white][Math.floor(Math.random()*5)],
      size: 4 + Math.random() * 4,
      life: 1, decay: 0.018 + Math.random() * 0.012,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2
    });
  }
}
function updateConfetti() {
  confetti = confetti.filter(p => p.life > 0);
  confetti.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25;
    p.vx *= 0.97; p.life -= p.decay; p.rot += p.rotV;
  });
}
function drawConfetti(ctx) {
  confetti.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    ctx.restore();
  });
}

// ===== GAME STATE =====
const POINT_VALS = ['0','15','30','40'];
let state = 'splash';
let splashBallX = 240, splashBallY = 260;
let splashBallVX = 3.2, splashBallVY = -2.8;
let splashPulse = 0;
let splashTime = 0;
let crowdShimmer = 0;
let flagFrame = 0, flagTimer = 0;
let netWave = 0, netWaveTimer = 0;

let sets = [{p:0,c:0},{p:0,c:0},{p:0,c:0}];
let currentSet = 0;
let gamesP = 0, gamesC = 0;
let pointsP = 0, pointsC = 0; // index into POINT_VALS
let deuce = false, advP = false, advC = false;
let isTiebreak = false;
let tbP = 0, tbC = 0;

let setsWonP = 0, setsWonC = 0;

// ball uses court coords: cx/cy [0-1], z=height above court, vcy>0=toward CPU
let ball = { cx:0.5, cy:0.5, z:0, vcx:0, vcy:0, vz:0, radius:8, trail:[], speed:1 };
let playerBear = { cx:0.5, swing:0, celebrate:0, lose:0, bounce:0, bounceT:0 };
let cpuBear    = { cx:0.5, swing:0, celebrate:0, lose:0, bounce:0, bounceT:0 };
let cpuLag = 0;
let cpuSpeed = 0.012; // court units per frame
let hitCount = 0;
let servingPlayer = 'player'; // or 'cpu'
let inRally = false;
let pointOverTimer = 0;
let pointOverMsg = '';
let matchOverMsg = '';
let matchWinner = ''; // 'player' or 'cpu'
let keyLeft = false, keyRight = false, keySwing = false;
let swingCooldown = 0;
let touchLeft = false, touchRight = false;

// Keys
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keyLeft = true;
  if (e.key === 'ArrowRight') keyRight = true;
  if (e.key === ' ' || e.key === 'z' || e.key === 'Z') {
    keySwing = true;
    if (state === 'splash') startGame();
    if (state === 'match_over') resetMatch();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keyLeft = false;
  if (e.key === 'ArrowRight') keyRight = false;
  if (e.key === ' ' || e.key === 'z' || e.key === 'Z') keySwing = false;
});

// Touch
const canvas = document.getElementById('gameCanvas');
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => {
    const rect = canvas.getBoundingClientRect();
    const tx = t.clientX - rect.left;
    const scaledX = tx * (W / rect.width);
    if (scaledX < W/2) touchLeft = true; else touchRight = true;
  });
  if (state === 'splash') startGame();
  if (state === 'match_over') resetMatch();
  // auto swing on touch
  if (state === 'playing') keySwing = true;
}, {passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchLeft = false; touchRight = false; keySwing = false;
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchLeft = false; touchRight = false;
  Array.from(e.touches).forEach(t => {
    const rect = canvas.getBoundingClientRect();
    const tx = t.clientX - rect.left;
    const scaledX = tx * (W / rect.width);
    if (scaledX < W/2) touchLeft = true; else touchRight = true;
  });
}, {passive:false});

function startGame() {
  state = 'playing';
  resetMatch();
}
function resetMatch() {
  sets = [{p:0,c:0},{p:0,c:0},{p:0,c:0}];
  currentSet = 0; gamesP = 0; gamesC = 0;
  pointsP = 0; pointsC = 0;
  deuce = false; advP = false; advC = false;
  isTiebreak = false; tbP = 0; tbC = 0;
  setsWonP = 0; setsWonC = 0;
  hitCount = 0; cpuSpeed = 0.012;
  confetti = [];
  servingPlayer = 'player';
  inRally = false;
  matchWinner = '';
  state = 'playing';
  serveBall();
}

function serveBall() {
  inRally = false;
  swingCooldown = 0;
  const fromPlayer = servingPlayer === 'player';
  ball.cx = fromPlayer ? playerBear.cx : cpuBear.cx;
  ball.cy = fromPlayer ? PLAYER_CY + 0.05 : CPU_CY - 0.05;
  ball.vcx = (Math.random() - 0.5) * 0.014;
  // vcy>0 = toward CPU; player serves toward CPU, cpu serves toward player
  ball.vcy = fromPlayer ? 0.030 : -0.030;
  ball.z = 2;
  ball.vz = 5;
  ball.speed = 1 + (currentSet * 0.08);
  ball.trail = [];
  hitCount = 0;
  inRally = true;
}

// ===== SCORING =====
function scorePoint(winner) {
  playPoint();
  const bsp = courtToScreen(ball.cx, ball.cy, ball.z);
  spawnConfetti(bsp.x, bsp.y);
  if (isTiebreak) {
    if (winner === 'player') tbP++; else tbC++;
    const lead = Math.abs(tbP - tbC);
    const hi = Math.max(tbP, tbC);
    if (hi >= 7 && lead >= 2) {
      const gWinner = winner;
      tbP = 0; tbC = 0; isTiebreak = false;
      scoreGame(gWinner);
    } else {
      pointOverMsg = winner === 'player' ? 'POLO BEAR!' : 'RALPH BEAR!';
      state = 'point_over'; pointOverTimer = 90;
      servingPlayer = winner;
      serveBall();
    }
    return;
  }
  if (!deuce && !advP && !advC) {
    if (winner === 'player') pointsP++; else pointsC++;
    if (pointsP >= 3 && pointsC >= 3) {
      deuce = true; pointsP = 3; pointsC = 3;
    }
    if (!deuce) {
      if (pointsP >= 4) { scoreGame('player'); return; }
      if (pointsC >= 4) { scoreGame('cpu'); return; }
    }
  } else if (deuce) {
    if (winner === 'player') advP = true; else advC = true;
    deuce = false;
  } else if (advP) {
    if (winner === 'player') { scoreGame('player'); return; }
    else { advP = false; deuce = true; }
  } else if (advC) {
    if (winner === 'cpu') { scoreGame('cpu'); return; }
    else { advC = false; deuce = true; }
  }
  pointOverMsg = winner === 'player' ? 'POLO BEAR!' : 'RALPH BEAR!';
  state = 'point_over'; pointOverTimer = 90;
  servingPlayer = winner;
  serveBall();
}

function scoreGame(winner) {
  playFanfare();
  deuce = false; advP = false; advC = false;
  pointsP = 0; pointsC = 0;
  if (winner === 'player') gamesP++; else gamesC++;
  sets[currentSet] = {p:gamesP, c:gamesC};
  // Check tiebreak
  if (gamesP === 6 && gamesC === 6) {
    isTiebreak = true;
    pointOverMsg = 'TIEBREAK!';
    state = 'point_over'; pointOverTimer = 110;
    servingPlayer = winner;
    serveBall();
    return;
  }
  // Check set win
  const pWin = (gamesP >= 6 && gamesP - gamesC >= 2);
  const cWin = (gamesC >= 6 && gamesC - gamesP >= 2);
  if (pWin || cWin) {
    const sw = pWin ? 'player' : 'cpu';
    sets[currentSet] = {p:gamesP, c:gamesC};
    if (sw === 'player') setsWonP++; else setsWonC++;
    gamesP = 0; gamesC = 0;
    currentSet = Math.min(currentSet + 1, 2);
    cpuSpeed += 0.002;
    if (setsWonP >= 2 || setsWonC >= 2) {
      matchWinner = sw;
      pointOverMsg = sw === 'player' ? 'CHAMPION!' : 'GAME SET MATCH';
      state = 'match_over';
      if (sw === 'player') { playerBear.celebrate = 120; spawnConfetti(240, 400); }
      else cpuBear.celebrate = 120;
      return;
    }
    pointOverMsg = 'GAME — ' + (sw==='player'?'POLO BEAR!':'RALPH BEAR!');
    state = 'point_over'; pointOverTimer = 130;
    servingPlayer = winner;
    serveBall();
    return;
  }
  pointOverMsg = 'GAME — ' + (winner==='player'?'POLO BEAR!':'RALPH BEAR!');
  state = 'point_over'; pointOverTimer = 110;
  servingPlayer = winner;
  serveBall();
}

function getScoreDisplay() {
  if (isTiebreak) return [tbP, tbC];
  if (deuce) return ['40','40'];
  if (advP) return ['AD','—'];
  if (advC) return ['—','AD'];
  return [POINT_VALS[pointsP]||'0', POINT_VALS[pointsC]||'0'];
}

// ===== DRAWING: COURT (perspective) =====
function cLine(ctx, cx1, cy1, cx2, cy2) {
  const a = courtToScreen(cx1, cy1, 0), b = courtToScreen(cx2, cy2, 0);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function courtLineH(ctx, cy) { cLine(ctx, 0, cy, 1, cy); }

function drawCourt(ctx) {
  // ---- Sky ----
  const skyGrad = ctx.createLinearGradient(0, 0, 0, FAR_SY);
  skyGrad.addColorStop(0, '#070F1E'); skyGrad.addColorStop(0.7, '#122040'); skyGrad.addColorStop(1, '#1A3060');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, FAR_SY);

  // Stars
  const starSeeds = [13,37,71,101,199,257,311,401,503,601];
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  starSeeds.forEach(s => {
    ctx.fillRect((s*37+7)%(W-30)+15, (s*13+3)%(FAR_SY-50)+8, 2, 2);
  });

  // Stadium lights (4 posts above court)
  [[70,12],[190,8],[290,8],[410,12]].forEach(([lx,ly]) => {
    ctx.fillStyle = '#6677AA'; ctx.fillRect(lx-3, ly, 5, 48);
    ctx.fillStyle = '#DDDDAA'; ctx.fillRect(lx-9, ly-4, 18, 6);
    ctx.fillStyle = 'rgba(255,255,180,0.12)';
    ctx.beginPath(); ctx.ellipse(lx, ly+10, 24, 50, 0, 0, Math.PI*2); ctx.fill();
  });

  // Crowd stand band (behind far baseline)
  const standGrad = ctx.createLinearGradient(0, 52, 0, FAR_SY);
  standGrad.addColorStop(0, '#101828'); standGrad.addColorStop(1, '#0E1830');
  ctx.fillStyle = standGrad; ctx.fillRect(0, 52, W, FAR_SY - 52);

  // Crowd rows — 4 rows shrinking toward top
  for (let row = 3; row >= 0; row--) {
    const rowY = FAR_SY - 18 - row * 20;
    const rowW = 28 + row * 56;  // wider rows near court
    const rowStart = (W - rowW * 2) / 2;
    const heads = Math.floor(rowW / 9);
    for (let col = 0; col < heads * 2; col++) {
      const hx = rowStart + col * 9 + (row % 2) * 4;
      const hy = rowY;
      const shimmerVal = Math.sin(crowdShimmer * 0.7 + col * 0.5 + row * 1.3);
      const baseC = (col + row) % 3 === 0 ? [20,40,90] : (col+row) % 3 === 1 ? [170,12,28] : [18,30,60];
      const rv = Math.floor(baseC[0] + shimmerVal*14);
      const gv = Math.floor(baseC[1] + shimmerVal*8);
      const bv = Math.floor(baseC[2] + shimmerVal*18);
      ctx.fillStyle = `rgb(${rv},${gv},${bv})`;
      ctx.beginPath(); ctx.arc(hx, hy, 5, Math.PI, 0); ctx.fill();
      ctx.fillRect(hx-5, hy, 10, 8);
    }
  }

  // Back-wall scoreboard sign (behind far baseline, SNES-style)
  ctx.fillStyle = '#1A1A2E';
  ctx.fillRect(W/2-80, FAR_SY - 60, 160, 52);
  ctx.fillStyle = COLORS.gold; ctx.lineWidth = 2; ctx.strokeStyle = COLORS.gold;
  ctx.strokeRect(W/2-80, FAR_SY - 60, 160, 52);
  ctx.font = '5px "Press Start 2P"'; ctx.textAlign = 'center';
  ctx.fillText('POLO BEAR', W/2, FAR_SY - 47);
  ctx.fillStyle = COLORS.white; ctx.font = '8px "Press Start 2P"';
  const scoreDisp2 = getScoreDisplay();
  ctx.fillText(scoreDisp2[0] + '   ' + scoreDisp2[1], W/2, FAR_SY - 33);
  ctx.fillStyle = COLORS.cream; ctx.font = '5px "Press Start 2P"';
  ctx.fillText('RALPH BEAR', W/2, FAR_SY - 20);

  // RL flag (left side, on pole)
  const flagX = 18, flagPoleTop = FAR_SY - 55, flagPoleBot = FAR_SY + 10;
  ctx.fillStyle = '#667799'; ctx.fillRect(flagX, flagPoleTop, 3, flagPoleBot - flagPoleTop);
  const fw = 28, fh = 16;
  const waveOffsets = [[0,0,0,0],[0,2,-2,0],[0,-2,2,0]];
  const wo = waveOffsets[flagFrame % 3];
  ctx.fillStyle = COLORS.navy;
  ctx.beginPath();
  ctx.moveTo(flagX+3, flagPoleTop);
  ctx.lineTo(flagX+3+fw/2+wo[1], flagPoleTop+fh*0.4+wo[0]);
  ctx.lineTo(flagX+3+fw+wo[2], flagPoleTop+fh/2+wo[1]);
  ctx.lineTo(flagX+3+fw/2+wo[3], flagPoleTop+fh*0.8+wo[2]);
  ctx.lineTo(flagX+3, flagPoleTop+fh+wo[3]);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = COLORS.gold; ctx.font = '5px "Press Start 2P"'; ctx.textAlign = 'left';
  ctx.fillText('RL', flagX+6, flagPoleTop+10);

  // ---- Green surround (fills area between sky and near baseline) ----
  ctx.fillStyle = COLORS.courtGreen;
  ctx.fillRect(0, FAR_SY, W, NEAR_SY - FAR_SY + 30);

  // Court surface trapezoid
  ctx.fillStyle = COLORS.courtBlue;
  ctx.beginPath();
  ctx.moveTo(NEAR_LX, NEAR_SY);
  ctx.lineTo(NEAR_RX, NEAR_SY);
  ctx.lineTo(FAR_RX, FAR_SY);
  ctx.lineTo(FAR_LX, FAR_SY);
  ctx.closePath();
  ctx.fill();

  // Courtside banners on green surround (left & right triangles)
  const bannerData = [['POLO RALPH LAUREN', COLORS.navy],['US OPEN', COLORS.red],['POLO RALPH LAUREN', COLORS.navy],['US OPEN', COLORS.red]];
  bannerData.forEach(([txt, col], i) => {
    const bx = (i < 2) ? 0 : W / 2;
    const bw = W / 4;
    const by = FAR_SY + 4 + (i % 2) * 22;
    ctx.fillStyle = col; ctx.fillRect(bx + (i%2)*bw, by, bw-2, 18);
    ctx.fillStyle = COLORS.gold; ctx.font = '4px "Press Start 2P"'; ctx.textAlign = 'center';
    ctx.fillText(txt, bx + (i%2)*bw + bw/2 - 1, by + 11);
  });

  // ---- Court lines ----
  ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2;
  courtLineH(ctx, 0);   // near baseline
  courtLineH(ctx, 1);   // far baseline
  cLine(ctx, 0, 0, 0, 1); // left sideline
  cLine(ctx, 1, 0, 1, 1); // right sideline
  cLine(ctx, 0.5, 0, 0.5, 1); // center service line
  courtLineH(ctx, 0.27); // player's service line
  courtLineH(ctx, 0.73); // CPU's service line

  // Doubles sidelines (slightly transparent)
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  cLine(ctx, 0.08, 0, 0.08, 1);
  cLine(ctx, 0.92, 0, 0.92, 1);

  // ---- Net (3D perspective) ----
  const netL0 = courtToScreen(-0.02, NET_CY, 0);
  const netR0 = courtToScreen(1.02, NET_CY, 0);
  const netL1 = courtToScreen(-0.02, NET_CY, NET_HEIGHT_Z);
  const netR1 = courtToScreen(1.02, NET_CY, NET_HEIGHT_Z);

  // Net body
  ctx.fillStyle = 'rgba(20,30,50,0.88)';
  ctx.beginPath();
  ctx.moveTo(netL1.x, netL1.y); ctx.lineTo(netR1.x, netR1.y);
  ctx.lineTo(netR0.x, netR0.y); ctx.lineTo(netL0.x, netL0.y);
  ctx.closePath(); ctx.fill();

  // Net mesh lines (vertical)
  ctx.strokeStyle = 'rgba(200,210,230,0.55)'; ctx.lineWidth = 1;
  const netWAmt = netWave;
  for (let ni = 0; ni <= 1; ni += 0.06) {
    const nb = courtToScreen(ni, NET_CY, 0);
    const nt = courtToScreen(ni, NET_CY, NET_HEIGHT_Z);
    const woff = Math.sin(ni * 18 + netWAmt) * 0.8;
    ctx.beginPath(); ctx.moveTo(nb.x + woff, nb.y); ctx.lineTo(nt.x + woff, nt.y); ctx.stroke();
  }
  // Net mesh lines (horizontal, 3 rows)
  for (let nz = 0; nz <= NET_HEIGHT_Z; nz += NET_HEIGHT_Z / 3) {
    ctx.beginPath();
    const nl = courtToScreen(-0.02, NET_CY, nz);
    const nr = courtToScreen(1.02, NET_CY, nz);
    ctx.moveTo(nl.x, nl.y + Math.sin(netWAmt)*0.6);
    ctx.lineTo(nr.x, nr.y + Math.sin(netWAmt + 0.5)*0.6);
    ctx.stroke();
  }
  // Net top tape (white stripe)
  ctx.strokeStyle = COLORS.white; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(netL1.x, netL1.y); ctx.lineTo(netR1.x, netR1.y); ctx.stroke();

  // Net posts
  ctx.fillStyle = COLORS.white;
  ctx.fillRect(netL0.x - 5, netL1.y - 4, 5, netL0.y - netL1.y + 8);
  ctx.fillRect(netR0.x,     netR1.y - 4, 5, netR0.y - netR1.y + 8);
  drawMiniRLLogo(ctx, netL0.x - 4, netL1.y);
}

function drawMiniRLLogo(ctx, x, y) {
  ctx.fillStyle = COLORS.navy;
  ctx.fillRect(x, y, 6, 8);
  ctx.fillStyle = COLORS.gold;
  // tiny horse silhouette
  ctx.fillRect(x+1, y+1, 4, 3);
  ctx.fillRect(x+3, y+3, 2, 4);
}

// ===== DRAWING: BEARS =====
function drawBear(ctx, bx, by, isPlayer, swing, celebrate, lose, bounceOff) {
  ctx.save();
  ctx.translate(bx, by + bounceOff);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 30, 22, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // Determine arm angle based on state
  let armAngle = 0.3; // default
  if (swing > 0) armAngle = -1.1;
  if (celebrate > 0) armAngle = -1.4;
  if (lose > 0) armAngle = 0.9;

  // Body
  ctx.fillStyle = '#C8A060'; // teddy brown
  ctx.beginPath();
  ctx.ellipse(0, 10, 18, 22, 0, 0, Math.PI*2);
  ctx.fill();

  // Shirt
  if (isPlayer) {
    // Navy rugby shirt with red+white stripes
    ctx.fillStyle = COLORS.navy;
    ctx.beginPath();
    ctx.ellipse(0, 10, 16, 20, 0, 0, Math.PI*2);
    ctx.fill();
    // Stripes
    const stripeColors = [COLORS.red, COLORS.white, COLORS.red];
    stripeColors.forEach((sc, si) => {
      ctx.fillStyle = sc;
      ctx.fillRect(-15, -2 + si*7, 30, 4);
    });
    // Clip shirt to body shape
  } else {
    // White tennis whites with navy trim
    ctx.fillStyle = '#F0EDE0';
    ctx.beginPath();
    ctx.ellipse(0, 10, 16, 20, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = COLORS.navy;
    ctx.fillRect(-16, 8, 32, 3);
  }

  // Shorts
  if (isPlayer) {
    ctx.fillStyle = COLORS.white;
  } else {
    ctx.fillStyle = COLORS.white;
  }
  ctx.fillRect(-14, 20, 28, 14);

  // Left leg
  ctx.fillStyle = '#C8A060';
  ctx.fillRect(-12, 30, 10, 14);
  // Right leg
  ctx.fillRect(2, 30, 10, 14);

  // Shoes
  ctx.fillStyle = COLORS.white;
  ctx.beginPath();
  ctx.ellipse(-7, 44, 8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(7, 44, 8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  if (isPlayer) {
    ctx.fillStyle = COLORS.red;
    ctx.fillRect(-14, 41, 14, 3);
    ctx.fillRect(0, 41, 14, 3);
  }

  // Left arm
  ctx.fillStyle = '#C8A060';
  ctx.save();
  ctx.translate(-18, 0);
  ctx.rotate(-armAngle * 0.5);
  ctx.fillRect(-5, 0, 10, 18);
  ctx.beginPath();
  ctx.arc(0, 18, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Right arm + racket
  ctx.save();
  ctx.translate(18, 0);
  ctx.rotate(armAngle);
  ctx.fillStyle = '#C8A060';
  ctx.fillRect(-5, 0, 10, 18);
  ctx.beginPath();
  ctx.arc(0, 18, 6, 0, Math.PI*2);
  ctx.fill();
  // Racket
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-2, 14, 4, 22); // handle
  ctx.strokeStyle = isPlayer ? COLORS.navy : COLORS.navy;
  ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(200,200,200,0.6)';
  ctx.beginPath();
  ctx.ellipse(0, 8, 11, 14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Racket strings
  ctx.strokeStyle = 'rgba(220,220,180,0.8)';
  ctx.lineWidth = 0.5;
  for (let si = -8; si <= 8; si += 4) {
    ctx.beginPath(); ctx.moveTo(si, -5); ctx.lineTo(si, 21); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, si+8); ctx.lineTo(10, si+8); ctx.stroke();
  }
  ctx.restore();

  // Head (on top of body)
  ctx.fillStyle = '#C8A060';
  ctx.beginPath();
  ctx.arc(0, -16, 18, 0, Math.PI*2);
  ctx.fill();

  // Ears
  ctx.fillStyle = '#C8A060';
  ctx.beginPath(); ctx.arc(-14, -30, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -30, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#E8B880';
  ctx.beginPath(); ctx.arc(-14, -30, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -30, 5, 0, Math.PI*2); ctx.fill();

  // Cap/visor
  if (isPlayer) {
    ctx.fillStyle = COLORS.navy;
    ctx.beginPath();
    ctx.ellipse(0, -26, 16, 6, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillRect(-16, -32, 32, 8);
    ctx.fillStyle = COLORS.white;
    ctx.fillRect(-18, -28, 36, 4);
  } else {
    ctx.fillStyle = COLORS.white;
    ctx.beginPath();
    ctx.ellipse(0, -26, 16, 6, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillRect(-16, -32, 32, 8);
    ctx.fillStyle = COLORS.navy;
    ctx.fillRect(-18, -28, 36, 4);
  }

  // Face
  ctx.fillStyle = '#E8B880';
  ctx.beginPath();
  ctx.ellipse(0, -12, 10, 8, 0, 0, Math.PI*2);
  ctx.fill();
  // Eyes
  if (celebrate > 0) {
    // Happy arc eyes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-6, -18, 3, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(6, -18, 3, Math.PI, 0); ctx.stroke();
  } else if (lose > 0) {
    // Sad eyes
    ctx.fillStyle = '#333';
    ctx.fillRect(-8, -19, 4, 3);
    ctx.fillRect(4, -19, 4, 3);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-5, -14, 3, 0, Math.PI); ctx.stroke();
  } else {
    // Normal eyes
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6, -18, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -18, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-5, -19, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -19, 1, 0, Math.PI*2); ctx.fill();
  }
  // Nose
  ctx.fillStyle = '#7B3F00';
  ctx.beginPath(); ctx.ellipse(0, -13, 4, 3, 0, 0, Math.PI*2); ctx.fill();
  // Mouth
  ctx.strokeStyle = '#5B2F00'; ctx.lineWidth = 1.5;
  if (celebrate > 0) {
    ctx.beginPath(); ctx.arc(0, -10, 4, 0.1, Math.PI-0.1); ctx.stroke();
  } else if (lose > 0) {
    ctx.beginPath(); ctx.arc(0, -7, 4, Math.PI+0.1, -0.1); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, -10, 3, 0.2, Math.PI-0.2); ctx.stroke();
  }

  // RL logo on shirt
  ctx.fillStyle = isPlayer ? COLORS.gold : COLORS.gold;
  ctx.font = '5px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('RL', 0, -2);

  ctx.restore();
}

// ===== DRAWING: BALL =====
function drawBall(ctx, b) {
  const pos = courtToScreen(b.cx, b.cy, b.z);
  const groundPos = courtToScreen(b.cx, b.cy, 0);

  // Trail
  b.trail.forEach((tp, i) => {
    const tpos = courtToScreen(tp.cx, tp.cy, tp.z || 0);
    const alpha = (i / b.trail.length) * 0.38;
    const tr = b.radius * tpos.scale * (i / b.trail.length) * 0.75;
    ctx.fillStyle = `rgba(180,220,60,${alpha})`;
    ctx.beginPath(); ctx.arc(tpos.x, tpos.y, Math.max(tr, 1), 0, Math.PI*2); ctx.fill();
  });

  // Shadow on court surface (at z=0)
  if (b.z > 0.5) {
    const alpha = Math.max(0.05, 0.28 - b.z * 0.007);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(groundPos.x, groundPos.y, b.radius * 1.5 * groundPos.scale, b.radius * 0.45 * groundPos.scale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Ball
  const r = Math.max(2, b.radius * pos.scale);
  ctx.fillStyle = '#CCEE44';
  ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(pos.x, pos.y, r * 0.7, 0.5, Math.PI-0.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(pos.x, pos.y, r * 0.7, Math.PI+0.5, -0.5); ctx.stroke();
}

// ===== DRAWING: SPLASH =====
function drawSplash(ctx) {
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#060F20');
  grad.addColorStop(0.5, COLORS.navy);
  grad.addColorStop(1, '#0F1E3A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  [50,130,220,310,420,70,190,350,15,290,440,165,375,85,255].forEach((sx, i) => {
    const sy = [30,55,20,80,40,110,65,25,90,50,75,35,95,15,60][i];
    const pulse = Math.sin(splashTime * 0.05 + i * 0.7) * 0.5 + 0.5;
    ctx.globalAlpha = 0.4 + pulse * 0.6;
    ctx.fillRect(sx, sy, 2, 2);
  });
  ctx.globalAlpha = 1;

  // Court preview strip at bottom
  ctx.fillStyle = COLORS.courtBlue;
  ctx.fillRect(0, H-120, W, 120);
  ctx.fillStyle = COLORS.courtGreen;
  ctx.fillRect(0, H-130, W, 14);
  ctx.fillStyle = COLORS.white;
  ctx.fillRect(40, H-120, 2, 120);
  ctx.fillRect(W-42, H-120, 2, 120);
  ctx.fillRect(40, H-75, W-80, 2);

  // Draw splash bear
  drawSplashBear(ctx);

  // Title "TEDDY TENNIS"
  ctx.shadowColor = COLORS.gold;
  ctx.shadowBlur = 12;
  ctx.fillStyle = COLORS.gold;
  ctx.font = '22px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('TEDDY', W/2, 340);
  ctx.fillText('TENNIS', W/2, 368);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = COLORS.cream;
  ctx.font = '6px "Press Start 2P"';
  ctx.fillText('A RALPH LAUREN', W/2, 390);
  ctx.fillText('US OPEN EXPERIENCE', W/2, 404);

  // Bouncing ball off title area
  ctx.fillStyle = '#CCEE44';
  ctx.beginPath();
  ctx.arc(splashBallX, splashBallY, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(splashBallX, splashBallY, 5, 0.5, Math.PI-0.5);
  ctx.stroke();

  // Pulsing PRESS TO PLAY button
  const pulse = Math.sin(splashTime * 0.08) * 0.15 + 0.85;
  ctx.save();
  ctx.translate(W/2, 470);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = COLORS.red;
  ctx.beginPath();
  ctx.roundRect(-100, -18, 200, 36, 6);
  ctx.fill();
  ctx.fillStyle = COLORS.white;
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('PRESS TO PLAY', 0, 6);
  ctx.restore();

  // RL Logo corner (bottom-left)
  ctx.fillStyle = COLORS.navy;
  ctx.fillRect(10, H-50, 50, 35);
  ctx.fillStyle = COLORS.gold;
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('RL', 35, H-28);
  // Polo player mini logo
  ctx.fillStyle = COLORS.white;
  ctx.fillRect(20, H-46, 30, 14);
  ctx.fillStyle = COLORS.navy;
  ctx.font = '5px "Press Start 2P"';
  ctx.fillText('POLO', 35, H-37);

  // Ralph's Coffee cup (bottom-right corner)
  drawRalphsCoffee(ctx, W-60, H-55);
}

function drawRalphsCoffee(ctx, x, y) {
  // Cup body
  ctx.fillStyle = '#8B2020';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x+6, y+30);
  ctx.lineTo(x+34, y+30);
  ctx.lineTo(x+40, y);
  ctx.closePath();
  ctx.fill();
  // Cup top rim
  ctx.fillStyle = COLORS.white;
  ctx.fillRect(x-2, y-4, 44, 7);
  // Coffee text
  ctx.fillStyle = COLORS.gold;
  ctx.font = '5px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText("RALPH'S", x+20, y+12);
  ctx.fillText('COFFEE', x+20, y+22);
  // Handle
  ctx.strokeStyle = '#8B2020';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x+38, y+15, 8, -0.5, 0.5);
  ctx.stroke();
  // Steam
  ctx.strokeStyle = 'rgba(200,200,200,0.5)';
  ctx.lineWidth = 1.5;
  [0, 8, 16].forEach(ox => {
    const steamOff = Math.sin(splashTime * 0.05 + ox * 0.3) * 2;
    ctx.beginPath();
    ctx.moveTo(x+8+ox, y-6);
    ctx.quadraticCurveTo(x+12+ox+steamOff, y-14, x+8+ox, y-20);
    ctx.stroke();
  });
}

// ===== DRAWING: MATCH OVER =====
function drawMatchOver(ctx) {
  ctx.fillStyle = 'rgba(10,35,66,0.95)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';

  if (matchWinner === 'player') {
    ctx.shadowColor = COLORS.gold;
    ctx.shadowBlur = 20;
    ctx.fillStyle = COLORS.gold;
    ctx.font = '28px "Press Start 2P"';
    ctx.textAlign = 'center';

    drawBear(ctx, 240, 300, true, 0, 120, 0, Math.sin(Date.now()*0.004)*4);
  } else {
    ctx.fillStyle = COLORS.red;
    ctx.font = '14px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('GAME, SET,', W/2, 90);
    ctx.fillText('MATCH', W/2, 112);
    ctx.fillStyle = COLORS.cream;
    ctx.font = '11px "Press Start 2P"';

  ctx.fillStyle = COLORS.white;
  ctx.font = '8px "Press Start 2P"';

  const setDisplay = sets.slice(0, Math.max(currentSet, setsWonP+setsWonC)).map(s=>`${s.p}-${s.c}`).join('  ');

  // Play Again button
  const pulse = Math.sin(Date.now() * 0.004) * 0.1 + 0.9;
  ctx.save();
  ctx.translate(W/2, 450);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = COLORS.red;
  ctx.beginPath();
  ctx.roundRect(-100, -20, 200, 40, 6);
  ctx.fill();
  ctx.fillStyle = COLORS.white;
  ctx.font = '10px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('PLAY AGAIN', 0, 7);
  ctx.restore();

  // Tagline
  ctx.fillStyle = COLORS.gold;
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('See you at the US Open', W/2, 510);
  ctx.fillText('— Ralph Lauren', W/2, 524);

  // Confetti
  drawConfetti(ctx);
}

// ===== GAME UPDATE =====
function updateGame() {
  if (state !== 'playing') return;

  // Player movement (court space)
  const moveDir = (keyLeft || touchLeft) ? -1 : (keyRight || touchRight) ? 1 : 0;
  playerBear.cx += moveDir * 0.015;
  playerBear.cx = Math.max(0.05, Math.min(0.95, playerBear.cx));

  // CPU AI (tracks ball.cx in court space, with lag for missed shots)
  if (Math.random() < 0.002) cpuLag = (Math.random() - 0.5) * 0.28;
  const targetCX = ball.cx + cpuLag;
  const dcx = targetCX - cpuBear.cx;
  cpuBear.cx += Math.min(Math.abs(dcx), cpuSpeed) * Math.sign(dcx);
  cpuBear.cx = Math.max(0.05, Math.min(0.95, cpuBear.cx));

  // Bear bounce animation
  playerBear.bounceT += 0.065; playerBear.bounce = Math.sin(playerBear.bounceT) * 2;
  cpuBear.bounceT += 0.065;    cpuBear.bounce    = Math.sin(cpuBear.bounceT) * 2;

  if (swingCooldown > 0) swingCooldown--;
  if (playerBear.swing > 0) playerBear.swing--;
  if (cpuBear.swing > 0)    cpuBear.swing--;
  if (playerBear.celebrate > 0) playerBear.celebrate--;
  if (cpuBear.celebrate > 0)    cpuBear.celebrate--;
  if (playerBear.lose > 0) playerBear.lose--;
  if (cpuBear.lose > 0)    cpuBear.lose--;

  if (!inRally) return;

  // Ball physics (court space + z-axis arc)
  ball.trail.push({ cx: ball.cx, cy: ball.cy, z: ball.z });
  if (ball.trail.length > 4) ball.trail.shift();

  const spd = ball.speed;
  ball.cx += ball.vcx * spd;
  ball.cy += ball.vcy * spd;
  ball.vz -= GRAVITY;
  ball.z  += ball.vz;

  // Bounce on court surface
  if (ball.z <= 0) {
    ball.z = 0;
    ball.vz = Math.abs(ball.vz) * 0.3;
    if (ball.vz < 0.5) ball.vz = 0;
  }

  // Spin after 5 hits
  if (hitCount >= 5) ball.vcx += (Math.random() - 0.5) * 0.002;

  // Side wall bounces (court left/right)
  if (ball.cx < 0) { ball.cx = 0; ball.vcx = Math.abs(ball.vcx); }
  if (ball.cx > 1) { ball.cx = 1; ball.vcx = -Math.abs(ball.vcx); }

  // Net collision: ONLY triggers when ball.z < net height at midcourt
  // This is the FIX — old code had no z-axis so net blocked all crossing shots
  if (ball.cy > NET_CY - 0.04 && ball.cy < NET_CY + 0.04 && ball.z < NET_HEIGHT_Z) {
    ball.vcy = -ball.vcy * 0.3; // bounce back weakly
    ball.vcx *= 0.5;
    ball.vz = 0.5; ball.z = 0;
    netWaveTimer = 0; // trigger wave anim
  }

  // Player swing detection (ball must be heading toward player, vcy<0)
  if ((keySwing || touchLeft || touchRight) && swingCooldown === 0) {
    const pdcx = Math.abs(ball.cx - playerBear.cx);
    const pdcy = Math.abs(ball.cy - PLAYER_CY);
    if (pdcx < 0.13 && pdcy < 0.13 && ball.z < 22 && ball.vcy < 0) {
      hitBall('player');
    }
  }

  // CPU auto-hit (ball must be heading toward CPU, vcy>0)
  const cdcx = Math.abs(ball.cx - cpuBear.cx);
  const cdcy = Math.abs(ball.cy - CPU_CY);
  if (cdcx < 0.13 && cdcy < 0.13 && ball.z < 22 && ball.vcy > 0 && cpuBear.swing === 0) {
    if (Math.random() < 0.12) { /* CPU misses */ }
    else { hitBall('cpu'); }
  }

  // Score: ball past player baseline (cy < 0)
  if (ball.cy < -0.06) {
    cpuBear.celebrate = 60; playerBear.lose = 60;
    inRally = false; scorePoint('cpu'); return;
  }
  // Score: ball past CPU baseline (cy > 1)
  if (ball.cy > 1.06) {
    playerBear.celebrate = 60; cpuBear.lose = 60;
    inRally = false; scorePoint('player'); return;
  }
}

function hitBall(hitter) {
  playThwack();
  hitCount++;
  ball.speed = 1 + (currentSet * 0.08) + Math.min(hitCount * 0.04, 0.8);

  if (hitter === 'player') {
    swingCooldown = 18;
    playerBear.swing = 18;
    const ax = (ball.cx - playerBear.cx) * 0.075 + (Math.random()-0.5)*0.018;
    ball.vcx = Math.max(-0.04, Math.min(0.04, ax));
    ball.vcy = 0.028 + Math.random() * 0.009; // toward CPU (positive)
    ball.vz = 5 + Math.random() * 0.8;
    ball.z = 2; ball.cy = PLAYER_CY + 0.06;
  } else {
    cpuBear.swing = 18;
    const ax = (ball.cx - cpuBear.cx) * 0.075 + (Math.random()-0.5)*0.018;
    ball.vcx = Math.max(-0.04, Math.min(0.04, ax));
    ball.vcy = -(0.028 + Math.random() * 0.009); // toward player (negative)
    ball.vz = 5 + Math.random() * 0.8;
    ball.z = 2; ball.cy = CPU_CY - 0.06;
  }
  netWaveTimer += 1;
}

// ===== MAIN GAME LOOP =====
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  // Update timers
  splashTime++;
  crowdShimmer += 0.025;
  flagTimer++;
  if (flagTimer > 12) { flagTimer = 0; flagFrame = (flagFrame+1) % 3; }
  netWaveTimer += 0.05;
  netWave = netWaveTimer;

  // Update splash ball
  if (state === 'splash') {
    splashBallX += splashBallVX;
    splashBallY += splashBallVY;
    splashBallVY += 0.08;
    if (splashBallX < 20 || splashBallX > W-20) splashBallVX *= -1;
    if (splashBallY > 420) { splashBallVY = -Math.abs(splashBallVY) * 0.9; splashBallY = 420; }
    if (splashBallY < 130) { splashBallVY = Math.abs(splashBallVY); }
    splashBallX = Math.max(20, Math.min(W-20, splashBallX));
  }

  // Point over timer
  if (state === 'point_over') {
    pointOverTimer--;
    if (pointOverTimer <= 0) state = 'playing';
    updateConfetti();
  }

  // Game update
  if (state === 'playing') {
    updateGame();
    updateConfetti();
  }

  if (state === 'match_over') {
    updateConfetti();
    if (matchWinner === 'player') {
      playerBear.celebrate = 120;
      spawnConfetti(Math.random() * W, Math.random() * 200 + 100);
    }
  }

  // Draw
  const canvas2 = document.getElementById('gameCanvas');
  const ctx = canvas2.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  if (state === 'splash') {
    drawSplash(ctx);
  } else if (state === 'playing' || state === 'point_over') {
    // Draw court
    drawCourt(ctx);

    // Draw bears in perspective
    const cpuPos    = courtToScreen(cpuBear.cx, CPU_CY, 0);
    const playerPos = courtToScreen(playerBear.cx, PLAYER_CY, 0);

    // CPU bear — smaller (far end) and flipped to face player
    ctx.save();
    ctx.translate(cpuPos.x, cpuPos.y);
    ctx.scale(cpuPos.scale, -cpuPos.scale); // perspective scale + flip to face down
    ctx.translate(-cpuPos.x, -cpuPos.y);
    drawBear(ctx, cpuPos.x, cpuPos.y, false, cpuBear.swing, cpuBear.celebrate, cpuBear.lose, cpuBear.bounce);
    ctx.restore();

    // Ball (with z-axis arc, drawn between the two bears for correct depth)
    drawBall(ctx, ball);

    // Player bear — full size (near end)
    drawBear(ctx, playerPos.x, playerPos.y, true, playerBear.swing, playerBear.celebrate, playerBear.lose, playerBear.bounce);

    // Confetti
    drawConfetti(ctx);

    // HUD
    drawHUD(ctx);

    // Point over overlay
    if (state === 'point_over') {
      drawPointOverlay(ctx, pointOverMsg);
    }
  } else if (state === 'match_over') {
    drawCourt(ctx);
    drawMatchOver(ctx);
  }

  requestAnimationFrame(gameLoop);
}

// Start
requestAnimationFrame(gameLoop);
</script>
